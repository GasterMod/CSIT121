<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Contact</h1>
    <nav>
      <ul>
        <li><a href="tierlist.html">Tier List</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main>
  <form action="#" method="post">
    <p>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name">
    </p>
    <p>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email">
    </p>
    <p>
      <label for="comment">Comment:</label><br>
      <textarea id="comment" name="comment" rows="4" cols="40"></textarea>
    </p>
    <fieldset>
      <legend>Do you agree with my rankings?</legend>
      <input type="radio" id="yes" name="agree" value="yes">
      <label for="yes">Yes</label>
      <input type="radio" id="no" name="agree" value="no">
      <label for="no">No</label>
    </fieldset>
    <p>
      <label for="best">How sure of your own rankings are you?</label>
      <select id="best" name="best">
        <option value="confident">Confident</option>
        <option value="somewhat-confident">Somewhat Confident</option>
        <option value="not-confident">Not Confident</option>
      </select>
    </p>
    <fieldset>
      <legend>Which ones did you disagree with? (check all)</legend>
      <input type="checkbox" id="c1" name="disagree" value="android">
      <label for="c1">Android</label>
      <input type="checkbox" id="c2" name="disagree" value="arch">
      <label for="c2">Arch</label>
      <input type="checkbox" id="c3" name="disagree" value="chromos">
      <label for="c3">Chrome OS</label>
      <input type="checkbox" id="c4" name="disagree" value="debian">
      <label for="c4">Debian</label>
      <input type="checkbox" id="c5" name="disagree" value="ios">
      <label for="c5">IOS</label>
      <input type="checkbox" id="c6" name="disagree" value="linux">
      <label for="c6">Linux</label>
      <input type="checkbox" id="c7" name="disagree" value="macos">
      <label for="c7">Mac OS</label>
      <input type="checkbox" id="c8" name="disagree" value="redhat">
      <label for="c8">Red Hat</label>
      <input type="checkbox" id="c9" name="disagree" value="windows">
      <label for="c9">Windows</label>
    </fieldset>
    <p>
      <button type="submit">Submit</button>
    </p>
  </form>
  </main>
  <footer>
    <p>All images and logos belong to their respective copyright holders. Copywrong 2026 </p>
  </footer>
</body>
</html>
